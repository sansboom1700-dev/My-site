<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>They Were Friends, One Day</title>
<style>
  :root{
    --ink-black:#ffffff;
    --void:#f7f7f7;
    --paper:#111111;
    --paper-dim:#4a4a4a;
    --rain-blue:#5c6b7a;
    --glow:#1a1a1a;
    --crack:#8a1f1f;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--ink-black);
    overflow:hidden;
    font-family:'EB Garamond', Georgia, serif;
  }

  @font-face{
    font-family:'Cinzel';
    src:local('Cinzel');
  }

  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(210,210,210,0.35) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(180deg, #ffffff 0%, #f2f2f2 100%);
  }

  /* subtle vignette */
  #vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(255,255,255,0) 40%, rgba(50,50,50,0.22) 100%);
    z-index:5;
  }

  /* fog drifting behind */
  .fog{
    position:absolute;
    inset:-10%;
    background:
      radial-gradient(ellipse 60% 30% at 20% 80%, rgba(80,80,80,0.05), transparent 60%),
      radial-gradient(ellipse 50% 25% at 80% 85%, rgba(80,80,80,0.04), transparent 60%);
    animation:fogdrift 22s ease-in-out infinite alternate;
    z-index:1;
  }
  @keyframes fogdrift{
    0%{ transform:translateX(-2%) translateY(0%); }
    100%{ transform:translateX(2%) translateY(-1.5%); }
  }

  /* rain canvas */
  canvas#rain{
    position:absolute;
    inset:0;
    z-index:6;
    pointer-events:none;
  }

  /* artwork */
  #art-wrap{
    position:relative;
    z-index:3;
    height:92vh;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    filter:brightness(1) contrast(1.05);
    animation:artreveal 3.2s ease-out 0.4s forwards;
  }

  @keyframes artreveal{
    0%   { opacity:0; transform:scale(1.03); filter:brightness(2.2) contrast(1.1); }
    35%  { opacity:1; }
    100% { opacity:1; transform:scale(1); filter:brightness(1) contrast(1.05); }
  }

  #art-wrap img{
    height:100%;
    width:auto;
    max-width:90vw;
    object-fit:contain;
    display:block;
    filter:drop-shadow(0 0 30px rgba(0,0,0,0.15));
    -webkit-mask-image:linear-gradient(to bottom, black 78%, rgba(0,0,0,0.55) 92%, rgba(0,0,0,0.15) 100%);
    mask-image:linear-gradient(to bottom, black 78%, rgba(0,0,0,0.55) 92%, rgba(0,0,0,0.15) 100%);
    mix-blend-mode:multiply;
  }

  /* ripple ring container, positioned over the reflection/puddle area of artwork */
  .ripples{
    position:absolute;
    z-index:4;
    left:50%;
    bottom:6%;
    width:70%;
    height:22%;
    transform:translateX(-50%);
    pointer-events:none;
    overflow:visible;
  }
  .ripple{
    position:absolute;
    bottom:10%;
    border:1px solid rgba(30,30,30,0.3);
    border-radius:50%;
    opacity:0;
    animation:rippleGrow 3.4s ease-out infinite;
  }
  @keyframes rippleGrow{
    0%{ width:2px; height:2px; opacity:0.6; }
    10%{ opacity:0.5; }
    100%{ width:220px; height:26px; opacity:0; }
  }

  /* title text */
  #title{
    position:absolute;
    z-index:8;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    width:100%;
    pointer-events:none;
  }

  #title .line{
    display:block;
    font-family:'Cinzel', 'Trajan Pro', Georgia, serif;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--paper);
    text-shadow:0 0 14px rgba(255,255,255,0.9), 0 1px 0 rgba(255,255,255,0.5);
    font-weight:400;
  }

  #title .line.big{
    font-size:clamp(1.4rem, 4.2vw, 2.6rem);
    margin-bottom:0.35em;
  }
  #title .line.small{
    font-size:clamp(0.7rem, 1.6vw, 1rem);
    letter-spacing:0.55em;
    color:var(--paper-dim);
  }

  .word{
    display:inline-block;
    opacity:0;
    filter:blur(6px);
    transform:translateY(14px);
    animation:wordIn 1.1s ease-out forwards;
  }

  @keyframes wordIn{
    0%{ opacity:0; filter:blur(6px); transform:translateY(14px); }
    100%{ opacity:1; filter:blur(0px); transform:translateY(0); }
  }

  .word.crack{
    color:var(--crack);
    text-shadow:0 0 10px rgba(255,255,255,0.85), 0 1px 0 rgba(255,255,255,0.4);
  }

  /* thin bleeding line under "one day" */
  #bleed{
    display:block;
    margin:0.6em auto 0;
    width:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--crack), transparent);
    animation:bleedGrow 1.4s ease-out 3.6s forwards;
  }
  @keyframes bleedGrow{
    to{ width:38%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:640px){
    #art-wrap{ height:78vh; }
    #title{ bottom:12%; }
  }
</style>
</head>

      <span class="word" style="animation-delay:2.15s">were</span>
      <span class="word" style="animation-delay:2.4s">friends,</span>
    </span>
    <span class="line big">
      <span class="word crack" style="animation-delay:2.9s">One</span>
      <span class="word crack" style="animation-delay:3.15s">Day.</span>
    </span>
    <span id="bleed"></span>
  </div>

  <audio id="bg-audio" src="song.mp3" loop preload="auto"></audio>

 

  <div id="vignette"></div>
</div>

<script>
// --- Rain effect ---
const canvas = document.getElementById('rain');
const ctx = canvas.getContext('2d');
let W, H, drops;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function initDrops(count){
  drops = [];
  for(let i=0;i<count;i++){
    drops.push({
      x: Math.random()*W,
      y: Math.random()*H,
      len: 10 + Math.random()*22,
      speed: 6 + Math.random()*10,
      drift: 0.6 + Math.random()*0.6,
      opacity: 0.08 + Math.random()*0.22,
      width: Math.random() < 0.15 ? 1.4 : 0.7
    });
  }
}
initDrops(Math.floor((window.innerWidth * window.innerHeight)/9000));

function drawRain(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(60,64,70,1)';
  ctx.lineCap = 'round';

  for(const d of drops){
    ctx.globalAlpha = d.opacity;
    ctx.lineWidth = d.width;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x - d.drift*3, d.y + d.len);
    ctx.stroke();

    d.y += d.speed;
    d.x -= d.drift;

    if(d.y > H + d.len){
      d.y = -d.len;
      d.x = Math.random()*W;
    }
    if(d.x < -20){
      d.x = W + 20;
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawRain);
}
drawRain();

// --- Ripple rings positioned along the puddle line ---
const rippleContainer = document.getElementById('ripples');
const rippleXPositions = [15, 35, 50, 65, 85];
function spawnRipple(){
  const r = document.createElement('div');
  r.className = 'ripple';
  const xPct = rippleXPositions[Math.floor(Math.random()*rippleXPositions.length)] + (Math.random()*10 - 5);
  r.style.left = xPct + '%';
  r.style.animationDuration = (2.6 + Math.random()*2.2) + 's';
  rippleContainer.appendChild(r);
  setTimeout(()=> r.remove(), 5200);
}
setInterval(spawnRipple, 550);
for(let i=0;i<5;i++) setTimeout(spawnRipple, i*300);

// --- Background music: local track, autoplay + looped ---
const bgAudio = document.getElementById('bg-audio');
bgAudio.volume = 0.85;
let isPlaying = false;

const dbg = document.getElementById('debug-log');
function log(msg){
  dbg.textContent += msg + '\n';
}
log('script started');
log('bgAudio element found: ' + !!bgAudio);
log('bgAudio src: ' + bgAudio.currentSrc);
bgAudio.addEventListener('error', () => {
  log('AUDIO ELEMENT ERROR: ' + JSON.stringify(bgAudio.error));
});
bgAudio.addEventListener('canplay', () => log('bgAudio: canplay fired'));
bgAudio.addEventListener('playing', () => log('bgAudio: playing fired'));

// --- Rain sound effect: synthesized so it needs no external file ---
let audioCtx = null;
let rainStarted = false;

function makeRainBuffer(ctx, seconds){
  const bufferSize = seconds * ctx.sampleRate;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<bufferSize;i++){
    const white = Math.random()*2 - 1;
    b0 = 0.99886*b0 + white*0.0555179;
    b1 = 0.99332*b1 + white*0.0750759;
    b2 = 0.96900*b2 + white*0.1538520;
    b3 = 0.86650*b3 + white*0.3104856;
    b4 = 0.55000*b4 + white*0.5329522;
    b5 = -0.7616*b5 - white*0.0168980;
    const pink = b0+b1+b2+b3+b4+b5+b6+white*0.5362;
    b6 = white*0.115926;
    data[i] = pink*0.11;
  }
  return buffer;
}

function startRain(){
  if(rainStarted) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    log('AudioContext created, state: ' + audioCtx.state);

    const noiseSource = audioCtx.createBufferSource();
    noiseSource.buffer = makeRainBuffer(audioCtx, 4);
    noiseSource.loop = true;

    const highpass = audioCtx.createBiquadFilter();
    highpass.type = 'highpass';
    highpass.frequency.value = 600;

    const lowpass = audioCtx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 7000;

    const rainGain = audioCtx.createGain();
    rainGain.gain.value = 0.16;

    noiseSource.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(rainGain);
    rainGain.connect(audioCtx.destination);

    noiseSource.start(0);
    rainStarted = true;
    log('rain noise started');
  } catch(e){
    log('RAIN ERROR: ' + e.message);
  }
}

function tryPlay(){
  log('tryPlay() called');
  const p = bgAudio.play();
  if(p !== undefined){
    p.then(() => { isPlaying = true; log('bgAudio.play() SUCCESS'); })
     .catch((e) => { isPlaying = false; log('bgAudio.play() FAILED: ' + e.name + ' - ' + e.message); });
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().then(()=>log('audioCtx resumed'));
  startRain();
}
tryPlay();

// Many browsers block audio autoplay until a user gesture — and only real
// gestures count (click, keypress, touch). Scroll/mousemove do NOT unlock
// autoplay, so we don't listen for those.
function firstInteraction(e){
  log('interaction detected: ' + e.type);
  if(!isPlaying) tryPlay();
  document.removeEventListener('click', firstInteraction);
  document.removeEventListener('keydown', firstInteraction);
  document.removeEventListener('touchstart', firstInteraction);
}
document.addEventListener('click', firstInteraction);
document.addEventListener('keydown', firstInteraction);
document.addEventListener('touchstart', firstInteraction);
</script>

</body>
</html>
